name: 2L2 Static Site Browser Smoke

on:
  push:
    branches:
      - website-improvements
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: |
          npm install --no-save --no-package-lock playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > site-server.log 2>&1 &
          sleep 2
      - name: Smoke test desktop, tablet and mobile behavior
        run: node tests/site-smoke.cjs
      - name: Save test screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2l2-browser-smoke
          path: |
            test-artifacts/
            site-server.log
          if-no-files-found: ignore
          retention-days: 7
